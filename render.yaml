services:
  - type: web
    name: detect-alert-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: HOST
        value: 0.0.0.0
      - key: MCP_API_KEY
        generateValue: true
      - key: GOOGLE_SHEETS_WEBAPP_URL
        value: https://script.google.com/macros/s/AKfycbzqbwuSC6ZF07PTXSlOayDymYlgNV4MVftHTPdm-fZvseWjopiqic9oq0TSuvbpa5cV/exec
      - key: PLANNING_MCP_URL
        value: https://workday-planning-mcp.onrender.com/mcp
      - key: PLANNING_MCP_API_KEY
        value: klWMOkQ9F4deCBmG4LIw8+0E5H5jNZI0vhaACzGo+/U=
      - key: TRIGGER_CHECK_INTERVAL_SECONDS
        value: "60"
      - key: TRIGGER_CHECK_AUTOSTART
        value: "true"
      - key: PLANNING_LEVEL
        value: Total Company
      - key: PLANNING_VERSION
        value: Scenario 1
      - key: PLANNING_TIME
        value: FY2027
      - key: PLANNING_TARGET_ACCOUNT
        value: Expense_Target
      - key: PLANNING_OPERATING_EXPENSES_ACCOUNT
        value: 6000_Operating_Expenses
      - key: PLANNING_WRITE_LEVEL
        value: Total Company (Only)
      - key: PLANNING_BASE_VERSION
        value: Working Budget
      - key: PLANNING_VARIANCE_REPORT_URL
        value: https://livec50a03.adaptiveplanning.com/adaptivepro/configuration/libraries/reports?src=%2Fmatrix-report-viewer%2F1506%2FM%3FreportId%3D1506%26reportType%3DM%26outputType%3DH%26reportKey%3Df56fb2b0-42cf-465b-b9e5-1fd455bc11ad
